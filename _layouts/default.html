<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="shell-inner">
          <a class="brand" href="{{ '/' | relative_url }}">
            <span class="brand-mark">G</span>
            <span class="brand-text">
              <strong>{{ site.title }}</strong>
              <span>工程师 / 构建者</span>
            </span>
          </a>

          <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}">首页</a>
            <a href="{{ '/projects.html' | relative_url }}">项目</a>
            <a href="{{ '/writing.html' | relative_url }}">文章</a>
            <a href="{{ '/about.html' | relative_url }}">关于</a>
          </nav>
        </div>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="shell-inner footer-inner">
          <div>
            <p class="footer-title">{{ site.title }}</p>
            <p class="footer-copy">聚焦智能体工作流、RAG 检索增强与面向真实产品的全栈实现。</p>
          </div>
          <div class="footer-links">
            <a href="https://github.com/galiliya">GitHub</a>
            <a href="mailto:galiliya@users.noreply.github.com">邮箱</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
