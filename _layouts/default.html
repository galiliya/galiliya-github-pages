<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="shell-inner">
          <a class="brand" href="{{ '/' | relative_url }}">
            <span class="brand-mark">G</span>
            <span class="brand-text">
              <strong>{{ site.title }}</strong>
              <span>Engineer / Builder</span>
            </span>
          </a>

          <nav class="site-nav" aria-label="Primary">
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/projects.html' | relative_url }}">Projects</a>
            <a href="{{ '/writing.html' | relative_url }}">Writing</a>
            <a href="{{ '/about.html' | relative_url }}">About</a>
          </nav>
        </div>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="shell-inner footer-inner">
          <div>
            <p class="footer-title">{{ site.title }}</p>
            <p class="footer-copy">AI-native full-stack engineer building agent workflows, RAG systems, and product-facing web experiences.</p>
          </div>
          <div class="footer-links">
            <a href="https://github.com/galiliya">GitHub</a>
            <a href="mailto:galiliya@users.noreply.github.com">Email</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
